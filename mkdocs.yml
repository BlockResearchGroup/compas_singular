site_name: COMPAS Singular
site_url: https://blockresearchgroup.github.io/compas_singular/

repo_name: BlockResearchGroup/compas_singular
repo_url: https://github.com/BlockResearchGroup/compas_singular/
edit_uri: edit/dev/docs/

copyright: Copyright &copy; 2019 - 2026, ETH Zurich - Block Research Group

extra:
  homepage: https://blockresearchgroup.github.io/compas_singular/

theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/images/compas_icon_white.png
  favicon: public/favicon.ico
  features:
    - content.code.copy
    - content.footnote.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - callouts:
      strip_period: no
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - toc:
      permalink: "¤"

plugins:
  - search
  # The Sphinx site lived under latest/. Only its root is redirected: the plugin accepts
  # .md keys only, and the old per-page .html URLs were never linked from outside.
  - redirects:
      redirect_maps:
        latest/index.md: index.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src] # search packages in the src folder
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://compas.dev/compas/latest/objects.inv
          options:
            allow_inspection: true
            backlinks: tree
            docstring_options:
              ignore_init_summary: true
              trim_doctest_flags: true
            docstring_style: numpy
            docstring_section_style: list
            filters: public
            group_by_category: true
            # The reference pages list their members under group headings (##), one entry each.
            heading_level: 3
            inheritance_diagram_direction: TD
            inherited_members: false
            line_length: 88
            merge_init_into_class: true
            modernize_annotations: true
            parameter_headings: false
            preload_modules: [mkdocstrings, compas]
            relative_crossrefs: true
            scoped_crossrefs: true
            separate_signature: true
            show_bases: false
            show_category_heading: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_modules: false
            show_if_no_docstring: false
            show_inheritance_diagram: false
            show_root_heading: true
            # The page title already names the module.
            show_root_full_path: false
            show_signature: true
            show_signature_annotations: true
            show_signature_type_parameters: true
            show_source: false
            show_submodules: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary:
              modules: false
            type_parameter_headings: true
            unwrap_annotated: true

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Tutorial:
      - tutorial/index.md
      - tutorial/overview.md
      - tutorial/workflow.md
      - tutorial/smoothing.md
      - tutorial/rhino.md
      - tutorial/mcp.md
  - Examples:
      - examples/index.md
      - Workflows:
          - examples/01_skeleton_workflow.md
          - examples/02_framefield_workflow.md
      - Coarse mesh:
          - examples/03_coarse_mesh_editing.md
          - examples/04_densities.md
          - examples/05_patterns.md
      - Dense mesh:
          - examples/06_quad_mesh_smoothing.md
          - examples/07_quad_mesh_editing.md
          - examples/13_dual_blocks.md
      - Domain features:
          - examples/08_curve_features.md
          - examples/09_point_features.md
          - examples/10_guides.md
          - examples/11_symmetry.md
          - examples/12_curved_boundaries.md
  - Reference:
      - algorithms: reference/compas_singular.algorithms.md
      - datastructures: reference/compas_singular.datastructures.md
      - editing: reference/compas_singular.editing.md
      - framefield: reference/compas_singular.framefield.md
      - geometry: reference/compas_singular.geometry.md
      - rhino: reference/compas_singular.rhino.md
      - symmetry: reference/compas_singular.symmetry.md
      - topology: reference/compas_singular.topology.md
      - utilities: reference/compas_singular.utilities.md
  - Other:
      - other/publications.md
      - other/citing.md
      - other/changelog.md
      - other/license.md
      - other/acknowledgements.md
