on:
  push:
    tags:
      - "v*"
      # v0.2.0.dev0 and the like only mark where a version's development starts; they never publish.
      - "!v*dev*"

name: Create Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: compas-dev/compas-actions.build@v5
        with:
          invoke_lint: true
          invoke_test: true
          python: ${{ matrix.python }}

  Publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions.publish@v3
        with:
          pypi_token: ${{ secrets.PYPI }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
